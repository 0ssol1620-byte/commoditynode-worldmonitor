name: CommodityNode foundation

on:
  pull_request:
    paths:
      - '.github/workflows/commoditynode-foundation.yml'
      - 'api/**'
      - 'e2e/commoditynode-*.spec.ts'
      - 'blog-site/**'
      - 'public/source/**'
      - 'scripts/*commoditynode*'
      - 'shared/commoditynode-*'
      - 'src/**'
      - 'tests/commoditynode-*'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'SOURCE-OFFER.md'
      - 'UPSTREAM.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commoditynode-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      COMMODITYNODE_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify license and deployed-source contracts
        run: npm run commoditynode:contracts

      - name: Verify third-party software inventory
        run: npm run commoditynode:licenses:check

      - name: Verify people-first publication and ad eligibility
        run: npm run commoditynode:editorial

      - name: Verify CommodityNode unit contracts
        run: |
          npx tsx --test tests/commoditynode-variant.test.mts tests/commoditynode-data-contracts.test.mts tests/commoditynode-route-policy.test.mts tests/commoditynode-event-pulse.test.mts
          node --test api/commoditynode-cors.test.mjs tests/commoditynode-license-inventory.test.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Build CommodityNode
        run: npm run build:commoditynode

      - name: Enforce CommodityNode performance budget
        run: npm run commoditynode:performance

      - name: Verify built identity and metadata
        run: node --test tests/commoditynode-built-html.test.mjs tests/commoditynode-design-tokens.test.mjs tests/commoditynode-research-build.test.mjs tests/commoditynode-event-build.test.mjs tests/commoditynode-vercel-routing.test.mjs

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: commoditynode-live-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
